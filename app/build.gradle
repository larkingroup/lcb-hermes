plugins { id 'com.android.application' }
def signingFile = rootProject.file('.signing/release.properties')
def secrets = new Properties()
if (signingFile.exists()) signingFile.withInputStream { secrets.load(it) }
android {
    namespace 'com.larkingroup.lcbhermes'
    compileSdk 36
    defaultConfig {
        applicationId 'com.larkingroup.lcbhermes'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs { release { if (signingFile.exists()) {
        storeFile rootProject.file('.signing/upload.jks')
        storePassword secrets.getProperty('storePassword')
        keyAlias 'lcb-hermes'
        keyPassword secrets.getProperty('keyPassword')
    } } }
    buildTypes { release {
        if (signingFile.exists()) signingConfig signingConfigs.release
        minifyEnabled true
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
